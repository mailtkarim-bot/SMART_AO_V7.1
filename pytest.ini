[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

[pytest-cov]
# Exclure les fichiers qui ne sont pas du code production
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*
    */build/*
    */builds/*
    */docs/*
    app/web/*
    app/tests/*
    app/mcp/*
    app/engines/notification_engine/*
    app/engines/plugin_engine/*
    app/engines/security_engine/*
    app/engines/ui_engine/*
    app/agents/agent_*/*.py
    app/schemas/*
    app/plugins/*
    app/core/logging.py
    app/core/database.py
    app/core/api_client.py
    app/engines/event_bus/replay.py
    app/engines/event_bus/models.py
    app/engines/workflow_engine/workflow.py

source = app

# Rapport
contexts = 10
show_missing = True
fail_under = 90
