# =============================================================================
# SMART_AO V7 - Application Service
# =============================================================================
# Service ClusterIP pour accéder à l'application SMART_AO V7
# Build 9 - Phase 5 - Gate 9

apiVersion: v1
kind: Service
metadata:
  name: smart-ao-app
  namespace: smart-ao-v7
  labels:
    app: smart-ao
    component: app
    version: v7
    build: "9"
    tier: application
  annotations:
    description: "Service principal de l'application SMART_AO V7"

spec:
  selector:
    app: smart-ao
    component: app
  
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: health
    port: 8001
    targetPort: 8001
    protocol: TCP
  
  type: ClusterIP
  clusterIP: None

---

# Service Headless pour DNS direct aux pods
apiVersion: v1
kind: Service
metadata:
  name: smart-ao-app-headless
  namespace: smart-ao-v7
  labels:
    app: smart-ao
    component: app
    version: v7
    build: "9"
    tier: application

spec:
  selector:
    app: smart-ao
    component: app
  
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: health
    port: 8001
    targetPort: 8001
    protocol: TCP
  
  type: ClusterIP
  clusterIP: None
