# =============================================================================
# SMART_AO V7 - Horizontal Pod Autoscaler
# =============================================================================
# Configuration de l'auto-scaling horizontal pour l'application
# Build 9 - Phase 5 - Gate 9

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smart-ao-app-hpa
  namespace: smart-ao-v7
  labels:
    app: smart-ao
    component: app
    version: v7
    build: "9"
    tier: application

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smart-ao-app
  
  # Nombre minimum et maximum de pods
  minReplicas: 3
  maxReplicas: 10
  
  # Stratégie de scaling
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min
    
    scaleUp:
      stabilizationWindowSeconds: 60  # 1 minute
      policies:
      - type: Percent
        value: 20
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
  
  # Métriques pour le scaling
  metrics:
  # Métrique CPU - Scaler à 70% d'utilisation
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
    
  # Métrique Mémoire - Scaler à 80% d'utilisation
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
    
  # Métrique personnalisée - Requêtes par seconde
  - type: Pods
    pods:
      metric:
        name: requests_per_second
      target:
        type: AverageValue
        averageValue: 50
