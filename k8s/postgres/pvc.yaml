# =============================================================================
# SMART_AO V7 - PostgreSQL Persistent Volume Claim
# =============================================================================
# Persistent Volume Claim pour le stockage des données PostgreSQL
# Build 9 - Phase 5 - Gate 9

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smart-ao-postgres-pvc
  namespace: smart-ao-v7
  labels:
    app: smart-ao
    component: postgres
    version: v7
    build: "9"
    tier: database
  annotations:
    description: "PVC pour les données PostgreSQL de SMART_AO V7"

spec:
  accessModes:
    - ReadWriteOnce
  
  resources:
    requests:
      storage: 50Gi
  
  storageClassName: standard
  
  volumeMode: Filesystem

---

