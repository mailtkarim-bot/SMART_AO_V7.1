# =============================================================================
# SMART_AO V7 - PostgreSQL ConfigMap
# =============================================================================
# Configuration de PostgreSQL pour SMART_AO V7
# Build 9 - Phase 5 - Gate 9

apiVersion: v1
kind: ConfigMap
metadata:
  name: smart-ao-postgres-config
  namespace: smart-ao-v7
  labels:
    app: smart-ao
    component: postgres
    version: v7
    build: "9"
    tier: database

# Configuration par défaut pour PostgreSQL
# Ces valeurs sont utilisées si les variables d'environnement ne sont pas définies
# ou peuvent être montées comme fichiers de configuration

data:
  # Fichier de configuration principal
  postgresql.conf: |
    # ===========================================================================
    # SMART_AO V7 PostgreSQL Configuration
    # ===========================================================================
    
    # CONNEXIONS ET AUTHENTIFICATION
    # ----------------------------------
    listen_addresses = '*'
    max_connections = 200
    
    # MÉMOIRE
    # ---------
    shared_buffers = 1GB
    effective_cache_size = 3GB
    maintenance_work_mem = 256MB
    work_mem = 16MB
    
    # JOURNAUX
    # ---------
    log_destination = 'stderr'
    logging_collector = on
    log_min_duration_statement = 1000  # Log des requêtes > 1s
    log_line_prefix = '%m [%p] %q%u@%d '
    
    # PERFORMANCE
    # ------------
    random_page_cost = 1.1
    effective_io_concurrency = 200
    
    # TIMEOUTS
    # ---------
    statement_timeout = 30000  # 30s
    lock_timeout = 10000        # 10s
    idle_in_transaction_session_timeout = 300000  # 5min
    
    # AUTOVACUUM
    # -----------
    autovacuum = on
    autovacuum_max_workers = 3
    autovacuum_naptime = 1min
    autovacuum_vacuum_threshold = 50
    autovacuum_analyze_threshold = 50
    autovacuum_vacuum_scale_factor = 0.1
    autovacuum_analyze_scale_factor = 0.05
    
    # CHECKPOINTS
    # ------------
    checkpoint_completion_target = 0.9
    checkpoint_timeout = 30min
    max_wal_size = 2GB
    min_wal_size = 1GB
    
    # ARCHIVAGE WAL
    # --------------
    wal_level = replica
    archive_mode = off
    archive_command = '/bin/true'
    
    # SÉCURITÉ
    # ---------
    ssl = off
    password_encryption = scram-sha-256
  
  # Fichier de configuration pour pg_hba.conf
  pg_hba.conf: |
    # ===========================================================================
    # PostgreSQL Client Authentication Configuration
    # ===========================================================================
    
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    
    # "local" is for Unix domain socket connections only
    local   all             all                                     trust
    
    # IPv4 local connections:
    host    all             all             127.0.0.1/32            trust
    
    # IPv6 local connections:
    host    all             all             ::1/128                 trust
    
    # All connections from within the cluster
    host    all             all             10.0.0.0/8              md5
    host    all             all             172.16.0.0/12          md5
    host    all             all             192.168.0.0/16         md5
    
    # Allow replication connections
    host    replication     all             10.0.0.0/8              md5
    host    replication     all             172.16.0.0/12          md5
    host    replication     all             192.168.0.0/16         md5
    
    # Connection from the application
    host    smart_ao_v7     smart_ao       10.0.0.0/8              md5
    host    smart_ao_v7     smart_ao       172.16.0.0/12          md5
    host    smart_ao_v7     smart_ao       192.168.0.0/16         md5
  
  # Script d'initialisation (optionnel)
  init.sql: |
    -- =========================================================================
    -- SMART_AO V7 - PostgreSQL Initialization Script
    -- =========================================================================
    
    -- Créer les extensions nécessaires
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    CREATE EXTENSION IF NOT EXISTS pg_cron;
    CREATE EXTENSION IF NOT EXISTS uuid-ossp;
    CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";
    
    -- Configurer les schémas
    CREATE SCHEMA IF NOT EXISTS smart_ao;
    
    -- Créer un utilisateur pour les backups
    CREATE USER IF NOT EXISTS backup_user WITH PASSWORD 'backup_password';
    GRANT CONNECT ON DATABASE smart_ao_v7 TO backup_user;
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO backup_user;
    
    -- Configuration des tablespaces (si nécessaire)
    -- CREATE TABLESPACE smart_ao_data LOCATION '/var/lib/postgresql/data/smart_ao';
    
    -- Notes: Les tables seront créées automatiquement par SQLAlchemy
    -- via Alembic lors du démarrage de l'application
