# =============================================================================
# SMART_AO V7 - PostgreSQL Service
# =============================================================================
# Service ClusterIP pour accéder à PostgreSQL depuis d'autres pods
# Build 9 - Phase 5 - Gate 9

apiVersion: v1
kind: Service
metadata:
  name: smart-ao-postgres
  namespace: smart-ao-v7
  labels:
    app: smart-ao
    component: postgres
    version: v7
    build: "9"
    tier: database
  annotations:
    description: "Service PostgreSQL pour SMART_AO V7"

spec:
  selector:
    app: smart-ao
    component: postgres
  
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    protocol: TCP
  
  type: ClusterIP
  clusterIP: None

---

# Service Headless pour DNS direct aux pods
apiVersion: v1
kind: Service
metadata:
  name: smart-ao-postgres-headless
  namespace: smart-ao-v7
  labels:
    app: smart-ao
    component: postgres
    version: v7
    build: "9"
    tier: database

spec:
  selector:
    app: smart-ao
    component: postgres
  
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    protocol: TCP
  
  type: ClusterIP
  clusterIP: None
