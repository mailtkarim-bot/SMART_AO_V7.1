# =============================================================================
# SMART_AO V7 - Qdrant Service
# =============================================================================
# Service ClusterIP pour accéder à Qdrant depuis d'autres pods
# Build 9 - Phase 5 - Gate 9

apiVersion: v1
kind: Service
metadata:
  name: smart-ao-qdrant
  namespace: smart-ao-v7
  labels:
    app: smart-ao
    component: qdrant
    version: v7
    build: "9"
    tier: search
  annotations:
    description: "Service Qdrant Vector Search pour SMART_AO V7"

spec:
  selector:
    app: smart-ao
    component: qdrant
  
  ports:
  - name: http
    port: 6333
    targetPort: 6333
    protocol: TCP
  - name: grpc
    port: 6334
    targetPort: 6334
    protocol: TCP
  
  type: ClusterIP
  clusterIP: None

---

# Service Headless pour DNS direct aux pods
apiVersion: v1
kind: Service
metadata:
  name: smart-ao-qdrant-headless
  namespace: smart-ao-v7
  labels:
    app: smart-ao
    component: qdrant
    version: v7
    build: "9"
    tier: search

spec:
  selector:
    app: smart-ao
    component: qdrant
  
  ports:
  - name: http
    port: 6333
    targetPort: 6333
    protocol: TCP
  - name: grpc
    port: 6334
    targetPort: 6334
    protocol: TCP
  
  type: ClusterIP
  clusterIP: None
